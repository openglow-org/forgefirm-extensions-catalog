# The catalog's check (tools/check.py), with the extension host of every
# supported firmware release (hosts), on each pull request and push. Beside the
# check, the firmware job compares the catalog with what forgefirm's default
# branch expects of it: the extension key, and the address of the index. On a
# push to main, once both have passed, the publish job signs the index with the
# OpenGlow extension key and publishes it (tools/publish.py). The key is the
# secret FORGEFIRM_EXT_KEY of the extension-signing environment, whose
# deployment branches are main alone: no pull request and no other branch
# receives it.

name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjansson-dev libarchive-dev libsodium-dev
      - name: fwup 1.16.0 (the version the image carries)
        run: |
          curl -fsSL -o /tmp/fwup.deb https://github.com/fwup-home/fwup/releases/download/v1.16.0/fwup_1.16.0_amd64.deb
          sudo dpkg -i /tmp/fwup.deb
      - name: The extension host of every supported firmware release
        run: sh tools/hosts.sh "$RUNNER_TEMP/hosts"
      - name: check_test and publish_test (the tools held to what they promise, on throwaway catalogs)
        run: |
          export FORGEEXT="$RUNNER_TEMP/hosts/host-0/build/forgeext" FFX="$(cat "$RUNNER_TEMP/hosts/ffx")"
          python3 -B tests/check_test.py
          python3 -B tests/publish_test.py
      - name: The archives fetched before, by SHA-256
        uses: actions/cache@v4
        with:
          path: .archives
          key: archives-${{ hashFiles('packages/**/*.json') }}
          restore-keys: archives-
      - name: Check
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          NO_FETCH: ${{ github.event_name == 'push' && '--no-fetch' || '' }}
        run: |
          base="$BASE"
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base=$(git hash-object -t tree /dev/null)
          fi
          python3 tools/check.py --base "$base" --ffx "$(cat "$RUNNER_TEMP/hosts/ffx")" \
            $(cat "$RUNNER_TEMP/hosts/hostargs") --archives .archives $NO_FETCH

  firmware:
    # What the firmware expects of this catalog, on forgefirm's default
    # branch: the extension key the image installs is keys/forgefirm-ext.pub,
    # and the address the pinned forgectrl fetches is this catalog's
    # latest-release download of the file tools/publish.py uploads. The same
    # two comparisons as forgefirm's forgetest-ci, run here so a change on
    # this side is caught where it is made. The address is read, never
    # requested: every request of it is counted as a download.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: catalog
      - name: Checkout forgefirm (master)
        uses: actions/checkout@v4
        with:
          repository: openglow-org/forgefirm
          ref: master
          path: forgefirm
      - name: forgectrl's pin
        id: pin
        run: |
          rev=$(sed -n 's/^SRCREV = "\([0-9a-f]\{40\}\)"$/\1/p' forgefirm/meta-forgefirm/recipes-forgefirm/forgectrl/forgectrl-pin.inc)
          [ -n "$rev" ] || { echo "forgectrl-pin.inc names no SRCREV"; exit 1; }
          echo "forgectrl $rev"
          echo "rev=$rev" >> "$GITHUB_OUTPUT"
      - name: Checkout forgectrl at its pin
        uses: actions/checkout@v4
        with:
          repository: openglow-org/forgectrl
          ref: ${{ steps.pin.outputs.rev }}
          path: forgectrl
          fetch-depth: 1
      - name: The image's extension key is this catalog's published key
        run: |
          published=catalog/keys/forgefirm-ext.pub
          image=forgefirm/meta-forgefirm/recipes-forgefirm/forgefirm-keys/files/ext/forgefirm-ext.pub
          for f in "$published" "$image"; do
            test -f "$f" || { echo "missing: $f"; exit 1; }
          done
          cmp -s "$published" "$image" || { echo "$image is not $published"; exit 1; }
      - name: The address in the pinned forgectrl is the file this catalog publishes (read, never requested)
        run: |
          python3 - <<'EOF'
          import ast, os, re, sys

          PREFIX = "https://github.com/openglow-org/forgefirm-extensions-catalog/releases/latest/download/"

          def fail(why):
              print(why)
              sys.exit(1)

          # the pinned forgectrl's src/extpkg.h
          try:
              header = open("forgectrl/src/extpkg.h").read()
          except OSError as e:
              fail("the pinned forgectrl has no src/extpkg.h: %s" % e)
          m = re.search(r'#define\s+EXTPKG_INDEX_URL\s*(?:\\\n\s*)?"([^"]*)"', header)
          if not m:
              fail("the pinned forgectrl's src/extpkg.h defines no EXTPKG_INDEX_URL")
          url = m.group(1)

          # the file this catalog's publish tool passes to gh release create
          tree = ast.parse(open("catalog/tools/publish.py").read())
          assigned = {n.targets[0].id: n.value for n in ast.walk(tree)
                      if isinstance(n, ast.Assign) and len(n.targets) == 1 and isinstance(n.targets[0], ast.Name)}

          def file_name(v):
              if isinstance(v, ast.Name):
                  v = assigned.get(v.id)
              if isinstance(v, ast.Call) and v.args:
                  v = v.args[-1]
              return os.path.basename(v.value) if isinstance(v, ast.Constant) and isinstance(v.value, str) else None

          names = [file_name(n.args[3]) if len(n.args) > 3 else None for n in ast.walk(tree)
                   if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id == "gh"
                   and [a.value for a in n.args[:2] if isinstance(a, ast.Constant)] == ["release", "create"]]
          if len(names) != 1 or not names[0]:
              fail("tools/publish.py passes no one file to gh release create: %s" % names)

          print("the pinned forgectrl: %s; this catalog publishes %s" % (url, names[0]))
          if url != PREFIX + names[0]:
              fail("the address is not %s" % (PREFIX + names[0]))
          EOF

  publish:
    needs: [check, firmware]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: extension-signing
    permissions:
      contents: write
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libjansson-dev libarchive-dev libsodium-dev
      - name: fwup 1.16.0 (the version the image carries)
        run: |
          curl -fsSL -o /tmp/fwup.deb https://github.com/fwup-home/fwup/releases/download/v1.16.0/fwup_1.16.0_amd64.deb
          sudo dpkg -i /tmp/fwup.deb
      - name: The extension host of every supported firmware release
        run: sh tools/hosts.sh "$RUNNER_TEMP/hosts"
      - name: Sign and publish the index, when it changed
        env:
          EXT_KEY: ${{ secrets.FORGEFIRM_EXT_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$EXT_KEY" ] || { echo "the extension-signing environment holds no FORGEFIRM_EXT_KEY"; exit 1; }
          umask 077
          key="$RUNNER_TEMP/forgefirm-ext.priv"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$EXT_KEY" > "$key"
          python3 tools/publish.py --ffx "$(cat "$RUNNER_TEMP/hosts/ffx")" $(cat "$RUNNER_TEMP/hosts/hostargs") --key "$key"
